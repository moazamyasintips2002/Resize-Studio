apiVersion: apps/v1
kind: Deployment
metadata:
  name: resize-studio
  labels:
    app: resize-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resize-studio
  template:
    metadata:
      labels:
        app: resize-studio
    spec:
  containers:
  - name: resize-studio
    image: moazamyasin/resize-studio:latest  # Updated with your username
    ports:
    - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: resize-studio-service
spec:
  type: NodePort
  selector:
    app: resize-studio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080  # You can access your app at http://<Node_IP>:30080

